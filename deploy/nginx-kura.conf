# /etc/nginx/sites-available/kura  — ganti domain-kamu.com
server {
  listen 80;
  server_name domain-kamu.com www.domain-kamu.com;

  client_max_body_size 2m;

  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # timpa, jangan teruskan header palsu dari pengunjung
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;                          # sinkron MAL bisa agak lama
  }
}
